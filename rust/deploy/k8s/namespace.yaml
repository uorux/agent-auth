apiVersion: v1
kind: Namespace
metadata:
  name: agent-auth
  labels:
    # The broker's pod meets the restricted profile (deployment.yaml).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
# Where the Kubernetes provisioner makes each grant's ServiceAccount
# (aa-<agent>-<grant id>), bound to its role by a RoleBinding in the target
# namespace (rust/DEVIATIONS.md, Provisioners). Nothing runs here: nobody
# with rights in a brokered namespace can run a pod as a grant's
# ServiceAccount, and the quota below keeps it that way.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-auth-grants
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: no-workloads
  namespace: agent-auth-grants
spec:
  hard:
    pods: "0"
    services: "0"
    secrets: "0"
    configmaps: "1" # kube-root-ca.crt
    persistentvolumeclaims: "0"
