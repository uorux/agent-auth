# The broker's secrets, from 1Password through the operator (as the homelab
# repo's apps do). Without the operator: plain Secrets with these names and
# keys (kubectl create secret generic ... --from-env-file / --from-file).
#
# agent-auth-env: one field per variable, the field's label being the
# variable's name (rust/README.md lists them all). At least ADMIN_TOKEN and
# ENCRYPTION_KEY; BROKER_SIGNING_KEY for daemons and signed tokens;
# DISCORD_TOKEN, DISCORD_CHANNEL_ID, DISCORD_OWNER_ID; OPENROUTER_API_KEY;
# GITHUB_APP_ID, GITHUB_INSTALLATION_ID; LLDAP_URL, LLDAP_ADMIN_USER,
# LLDAP_ADMIN_PASSWORD, LLDAP_LDAP_URL, LLDAP_BASE_DN; LITELLM_MASTER_KEY.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: agent-auth-env
  namespace: agent-auth
spec:
  itemPath: "vaults/k8s/items/agent-auth-env"
---
# The GitHub App's private key: one field `app.pem`.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: agent-auth-github-key
  namespace: agent-auth
spec:
  itemPath: "vaults/k8s/items/agent-auth-github-key"
---
# Policy kept out of the repo agents can read (restricted zones' projects,
# rules, readers), merged over policy.yaml at start: one field
# `policy-private.yaml`. If it is missing or does not parse, the broker does
# not start.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: agent-auth-policy-private
  namespace: agent-auth
spec:
  itemPath: "vaults/k8s/items/agent-auth-policy-private"
