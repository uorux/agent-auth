# cargo-fuzz targets: every parser of untrusted input (ARCHITECTURE.md).
# A workspace of its own, so the main build never links libFuzzer.
#   nix develop ..#nightly -c cargo fuzz run <target> -- -max_total_time=60
[package]
name = "agent-auth-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "=0.4.13"
agent-auth-core = { path = "../crates/core" }
agent-auth-wire = { path = "../crates/wire" }
agent-auth-crypto = { path = "../crates/crypto" }
ring = { version = "=0.17.14", default-features = false, features = ["alloc", "std"] }
# float_roundtrip: so a re-parsed f64 (`wait`) compares equal in the round trips.
serde_json = { version = "1.0.152", default-features = false, features = ["std", "float_roundtrip"] }
time = { version = "=0.3.55", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "api_key_parse"
path = "fuzz_targets/api_key_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "canonical_json"
path = "fuzz_targets/canonical_json.rs"
test = false
doc = false
bench = false

