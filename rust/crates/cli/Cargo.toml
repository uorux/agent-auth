[package]
name = "agent-auth-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "agent-auth"
path = "src/main.rs"

[dependencies]
agent-auth-client.workspace = true
agent-auth-core.workspace = true
agent-auth-crypto.workspace = true
agent-auth-tls = { workspace = true, features = ["reqwest"] }
agent-auth-wire.workspace = true
clap.workspace = true
reqwest.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "net", "io-util"] }
url.workspace = true

[dev-dependencies]
agent-auth-client = { workspace = true, features = ["testing"] }
